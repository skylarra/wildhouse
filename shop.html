<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="twitter:card" content="summary_large_image">
    <meta property="og:site_name" content="Wildhouse Lane">
    <meta property="og:type" content="website">
    <meta name="description" content="Shop handmade Wildhouse Lane goods - suncatchers, keychains, stickers, magnets, patches, and tees.">
    <meta property="og:title" content="Shop | Wildhouse Lane">
    <meta property="og:description" content="Wildlife-inspired art and handmade goods.">
    <meta property="og:image" content="https://wildhouselane.com/assets/wildhouselogo-pink-brown.png">
    <meta property="og:url" content="https://wildhouselane.com/shop.html">
    <title>Shop | Wildhouse Lane</title>
    <link rel="canonical" href="https://wildhouselane.com/shop.html">
    <link rel="icon" type="image/svg+xml" href="./assets/WILDHOUSE-logomark.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Shadows+Into+Light&display=swap" rel="stylesheet">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="site-announcement"></div>
    <header id="site-header"></header>

    <main id="main-content" class="shop-all-page">
        <aside class="side-bar">
            <h2>Categories</h2>
            <ul id="category-list"></ul>
        </aside>
        <section class="shop">
            <h1>SHOP ALL</h1>
            <div class="shop-toolbar">
                <label class="field shop-search-field">
                    <span class="visually-hidden">Search products</span>
                    <input type="search" id="shop-search" placeholder="Search products…" autocomplete="off">
                </label>
                <label class="field shop-sort-field">
                    <span class="visually-hidden">Sort products</span>
                    <select id="shop-sort">
                        <option value="featured">Featured</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                        <option value="name-asc">Name: A to Z</option>
                    </select>
                </label>
                <p class="shop-count" id="shop-count" aria-live="polite"></p>
            </div>
            <div class="product-grid" id="shop-grid" aria-live="polite"></div>
        </section>
    </main>

    <div id="site-newsletter"></div>
    <footer id="site-footer" class="site-footer"></footer>

    <script type="module" src="./js/components.js"></script>
    <script type="module" src="./js/shop.js"></script>
</body>
</html>
