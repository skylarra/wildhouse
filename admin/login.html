<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin · Login | Wildhouse Lane</title>
    <base href="/">
    <link rel="icon" type="image/svg+xml" href="/assets/WILDHOUSE-logomark.svg">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body admin-body--login">
    <a class="skip-link" href="#admin-login-main">Skip to content</a>

    <main id="admin-login-main" class="admin-main admin-main--narrow">
        <section class="admin-card admin-login-card">
            <p class="admin-brand-line"><a class="admin-brand" href="/index.html">← Storefront</a></p>
            <h1 class="admin-title">Admin login</h1>
            <p class="admin-tagline">Enter the Cloudflare <code>ADMIN_PASSWORD</code>. The password is verified on the server and is never stored in the repository.</p>
            <form id="admin-login-form" class="admin-unlock">
                <label class="field">
                    <span>Admin password</span>
                    <input type="password" id="admin-password" name="password" autocomplete="current-password" required>
                </label>
                <button type="submit" class="btn secondary" id="admin-login-submit">Log in</button>
            </form>
            <p class="admin-status" id="admin-login-status" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script type="module" src="/js/admin-login.js"></script>
</body>
</html>
